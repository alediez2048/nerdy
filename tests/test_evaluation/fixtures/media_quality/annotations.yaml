# Calibration golden set — PI-09
#
# This file lists the reference images and videos used by
# test_media_quality_calibration.py to verify that the unified
# media_quality evaluator preserves tier separation and spread.
#
# tier: great | mid | bad
# source: where the file came from (session_id/path or hand-curated note)
# notes: 1–2 line description used by the test report
#
# The fixture files themselves live next to this YAML under
# images/ and videos/ and are NOT committed to the repo
# (gitignore covers .png + .mp4). To populate:
#   1. Run a real image pipeline session and copy 12 representative
#      output/images/*.png files into ./images/
#   2. Run a real video pipeline session and copy 8 representative
#      output/videos/*.mp4 files into ./videos/
#   3. Update file names below to match what you copied
#   4. Run: GEMINI_API_KEY=... pytest -m calibration
#
# When fixtures are missing the calibration tests skip cleanly so the
# default CI gate stays green.

